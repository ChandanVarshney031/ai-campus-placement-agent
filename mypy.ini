# mypy configuration for gradual type checking in AI Campus Placement Agent
# Global settings start permissive to allow legacy modules to adopt typing over time,
# while clean/utility modules and newly written code are strictly enforced.

[mypy]
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
follow_imports = silent
explicit_package_bases = true

# ==============================================================================
# Strict Type-Checked Modules List (Cleaned & Maintained)
# Any changes to these modules must maintain full type annotations.
# Removing annotations or introducing type errors will fail CI.
# ==============================================================================

# Text cleaning & normalization utilities
[mypy-utils.text_cleaner]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Scoring explanation utilities
[mypy-utils.score_explanations]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Application-wide input validation & sanitization
[mypy-utils.input_validator]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Email domain validation
[mypy-utils.email_domain_validator]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Subresource Integrity (SRI) validation
[mypy-utils.sri_validator]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
