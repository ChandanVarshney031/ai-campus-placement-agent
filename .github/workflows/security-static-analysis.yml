name: Secret & Static Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret Scanning (PR Diff & Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  bandit-ast-security:
    name: Bandit Python AST Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit AST Scan with Baseline
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python utils/run_bandit_scan.py .bandit-baseline.json .bandit.yaml
