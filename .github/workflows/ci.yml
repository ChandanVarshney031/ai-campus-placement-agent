name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-diagnostics:
    name: Environment & Pre-Flight Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov hypothesis

          - name: Run Linting Checks
        run: |
          flake8 .
          black --check .

      - name: Run Automated Accessibility Regression Tests
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest tests/test_accessibility.py -v

      - name: Run Full Test Suite
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest -v

      - name: Run CI Pipeline Validator
        run: |
          python utils/ci_pipeline_validator.py

      - name: Run Deployment Pre-Flight Check
        run: |
          python utils/deployment_check.py

      - name: Verify Route Contract & Frontend URLs
        run: |
          python utils/route_contract.py

  lint:
    name: Code Linting & Style Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort mypy

      - name: Run Flake8 Critical Error Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Flake8 Style & Complexity Check
        run: |
          # Report complexity and style warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Mypy Gradual Static Type Check
        run: |
          # Run mypy on clean, strictly type-checked modules
          mypy --config-file mypy.ini utils/text_cleaner.py utils/score_explanations.py utils/input_validator.py utils/email_domain_validator.py utils/sri_validator.py

      - name: Run Black Code Formatting Check
        run: black --check .
        continue-on-error: true

      - name: Run Isort Import Sorting Check
        run: isort --check-only .
        continue-on-error: true

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Bandit AST Security Scan
        run: bandit -r agents utils app.py -ll || true

      - name: Run Safety Dependency Check
        run: safety check || true

      - name: Run Subresource Integrity (SRI) Check
        run: python utils/sri_validator.py

  dependency-vulnerability-scan:
    name: Dependency Vulnerability Audit (Python & JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit pyyaml

      - name: Install NPM Production Dependencies
        run: |
          npm ci --omit=dev --ignore-scripts || npm install --omit=dev --package-lock-only || true

      - name: Run Automated Dependency Vulnerability Audit
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python utils/dependency_audit.py \
            -r requirements.txt \
            --ignore-file .pip-audit-ignore.yml \
            --package-json package.json \
            --npm-ignore-file .npm-audit-ignore.json \
            --audit-level high \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Verify Audit Fails on Vulnerable Package
        run: |
          echo "urllib3==1.26.4" > test-vulnerable-req.txt
          if python utils/dependency_audit.py -r test-vulnerable-req.txt --ignore-file .pip-audit-ignore.yml --skip-npm; then
            echo "Expected audit to fail on vulnerable package urllib3==1.26.4, but it passed!"
            exit 1
          else
            echo "Verified: Dependency audit correctly detected Python vulnerability and exited with non-zero code."
          fi
          rm -f test-vulnerable-req.txt

  syntax-validation:
    name: Syntax & Bytecode Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Runtime Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Core Modules
        run: |
          python -m py_compile app.py config.py prompts.py
          for file in agents/*.py; do python -m py_compile "$file"; done
          for file in utils/*.py; do python -m py_compile "$file"; done
        env:
          FLASK_SECRET_KEY: ci-compilation-token-test

  matrix-testing:
    name: Automated Test Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [environment-diagnostics, syntax-validation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov hypothesis

      - name: Execute Automated Test Suite
        run: |
          pytest --cov=agents --cov=utils --cov-report=term-missing --cov-report=xml:coverage.xml
        env:
          FLASK_SECRET_KEY: ci-matrix-secret-key-2026
          TESTING: 'true'

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  playwright-e2e:
    name: Playwright UI Smoke Tests (E2E)
    runs-on: ubuntu-latest
    needs: [environment-diagnostics, syntax-validation]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright playwright

      - name: Install Playwright Chromium Browser
        run: |
          playwright install --with-deps chromium

      - name: Execute Playwright Student Journey Tests
        env:
          FLASK_SECRET_KEY: ci-playwright-secret-key-2026
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest tests/test_playwright_student_journey.py -v --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Upload Playwright Traces and Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7

  lighthouse-ci:
    name: Lighthouse CI Quality & Budget Audits
    runs-on: ubuntu-latest
    needs: [environment-diagnostics, syntax-validation]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Runtime & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install beautifulsoup4 pytest

      - name: Execute Automated Lighthouse CI Budget Audits
        env:
          FLASK_SECRET_KEY: ci-lighthouse-secret-key-2026
          RATE_LIMIT_ENABLED: "false"
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python utils/lighthouse_ci.py --config lighthouserc.json --summary-file "$GITHUB_STEP_SUMMARY"

